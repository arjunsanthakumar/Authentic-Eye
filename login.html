<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTHENTIC EYE - LOGIN & SIGNUP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex items-center justify-center relative bg-gray-900">

  <!-- Background Image with Overlay -->
  <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('background.jpg');"></div>
  <div class="absolute inset-0 bg-black/60"></div>

  <!-- Login & Signup Container -->
  <div class="relative w-full max-w-sm sm:max-w-md bg-white/90 backdrop-blur-lg rounded-2xl p-6 sm:p-8 shadow-2xl mx-4 sm:mx-0">
    
    <!-- Logo & Name -->
    <div class="flex flex-col items-center mb-6">
      <img src="aulogo.png" alt="Authentic Eye Logo" class="w-24 h-24 sm:w-28 sm:h-28">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 uppercase tracking-wide text-center">
        AUTHENTIC EYE
      </h1>
    </div>
    
    <!-- LOGIN FORM -->
    <form id="login-form" class="space-y-4 sm:space-y-5">
      <div class="relative">
        <input id="login-username" type="text" placeholder="Username or Email" required
               class="w-full px-4 py-2 sm:py-3 border rounded-lg pl-10 focus:ring-2 focus:ring-gray-900">
        <span class="absolute left-3 top-2.5 sm:top-3 text-gray-500">👤</span>
      </div>
      
      <div class="relative">
        <input id="login-password" type="password" placeholder="Password" required
               class="w-full px-4 py-2 sm:py-3 border rounded-lg pl-10 focus:ring-2 focus:ring-gray-900">
        <span class="absolute left-3 top-2.5 sm:top-3 text-gray-500">🔒</span>
      </div>
      
      <div class="flex justify-between text-xs sm:text-sm">
        <label class="flex items-center">
          <input type="checkbox" class="mr-1"> Remember Me
        </label>
        <a href="#" class="text-blue-500 hover:underline">Forgot Password?</a>
      </div>
      
      <button type="submit" class="w-full bg-black text-white py-2 sm:py-3 rounded-lg text-sm sm:text-lg font-bold hover:bg-gray-800 transition">
        GET STARTED
      </button>
      
      <p class="text-center text-xs sm:text-sm">
        Don't have an account? 
        <a href="#" class="text-blue-500 hover:underline" onclick="toggleForms()">Create Account</a>
      </p>
    </form>
    
    <!-- SIGNUP FORM (Hidden Initially) -->
    <form id="signup-form" class="space-y-4 sm:space-y-5 hidden">
      <div class="relative">
        <input id="signup-username" type="text" placeholder="Username" required
               class="w-full px-4 py-2 sm:py-3 border rounded-lg pl-10 focus:ring-2 focus:ring-gray-900">
        <span class="absolute left-3 top-2.5 sm:top-3 text-gray-500">👤</span>
      </div>
      
      <div class="relative">
        <input id="signup-email" type="email" placeholder="Email" required
               class="w-full px-4 py-2 sm:py-3 border rounded-lg pl-10 focus:ring-2 focus:ring-gray-900">
        <span class="absolute left-3 top-2.5 sm:top-3 text-gray-500">📧</span>
      </div>
      
      <div class="relative">
        <input id="signup-password" type="password" placeholder="Password" required
               class="w-full px-4 py-2 sm:py-3 border rounded-lg pl-10 focus:ring-2 focus:ring-gray-900">
        <span class="absolute left-3 top-2.5 sm:top-3 text-gray-500">🔒</span>
      </div>
      
      <div class="relative">
        <input id="signup-confirm-password" type="password" placeholder="Confirm Password" required
               class="w-full px-4 py-2 sm:py-3 border rounded-lg pl-10 focus:ring-2 focus:ring-gray-900">
        <span class="absolute left-3 top-2.5 sm:top-3 text-gray-500">🔑</span>
      </div>
      
      <button type="submit" class="w-full bg-black text-white py-2 sm:py-3 rounded-lg text-sm sm:text-lg font-bold hover:bg-gray-800 transition">
        CREATE ACCOUNT
      </button>
      
      <p class="text-center text-xs sm:text-sm">
        Already have an account? 
        <a href="#" class="text-blue-500 hover:underline" onclick="toggleForms()">Login</a>
      </p>
    </form>
    
  </div>
  
  <!-- Toggle Script -->
  <script>
    function toggleForms() {
      document.getElementById("login-form").classList.toggle("hidden");
      document.getElementById("signup-form").classList.toggle("hidden");
    }

    // LOGIN FORM: Redirect to index.html if details are filled
    document.getElementById("login-form").addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent default form submission
      
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      if (username && password) {
        window.location.href = "index.html"; // Redirect to index page
      } else {
        alert("Please fill in both Username/Email and Password.");
      }
    });

    // SIGNUP FORM: Redirect to login form after successful signup
    document.getElementById("signup-form").addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent default form submission
      
      const username = document.getElementById("signup-username").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const confirmPassword = document.getElementById("signup-confirm-password").value;

      if (!username || !email || !password || !confirmPassword) {
        alert("All fields are required.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      alert("Signup successful! Please log in.");
      toggleForms(); // Switch to login form
    });
  </script>

</body>
</html>
